name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix plugins/showreel/skills/showreel/engine ci
      - run: npx --prefix plugins/showreel/skills/showreel/engine playwright install --with-deps chromium
      - run: npm test
      - run: npm run check:example
